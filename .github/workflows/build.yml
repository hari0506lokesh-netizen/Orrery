name: Build Orrery IPA
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Find the project
        run: |
          echo "Files in this repository:"
          find . -path ./.git -prune -o -type f -print | head -40
          ZIP=$(find . -path ./.git -prune -o -type f -iname '*.zip' -print | head -1)
          SEARCH=.
          if [ -n "$ZIP" ]; then
            echo "Unpacking $ZIP"
            unzip -q -o "$ZIP" -d "$RUNNER_TEMP/src"
            SEARCH="$RUNNER_TEMP/src"
          fi
          PBX=$(find "$SEARCH" -path '*/.git' -prune -o -path '*Orrery.xcodeproj/project.pbxproj' -print | head -1)
          if [ -z "$PBX" ]; then
            echo "::error::Orrery-iOS.zip isn't in this repository yet. Upload it with Add file → Upload files; the build reruns by itself."
            exit 1
          fi
          PROJ=$(cd "$(dirname "$(dirname "$PBX")")" && pwd)
          echo "Project folder: $PROJ"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
      - name: Build (unsigned, AltStore signs it)
        run: |
          cd "$PROJ"
          xcodebuild -project Orrery.xcodeproj -target Orrery -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Release-iphoneos/Orrery.app Payload/
          zip -qry "$GITHUB_WORKSPACE/Orrery.ipa" Payload
      - name: Publish Orrery.ipa as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "$GITHUB_WORKSPACE/Orrery.ipa" \
            --title "Orrery build ${{ github.run_number }}" --notes "Open Orrery.ipa with AltStore."
