# Fallback only. If Orrery.xcodeproj ever fails to open, install XcodeGen (brew install xcodegen)
# and run `xcodegen` in this folder to regenerate the project from this file.
name: Orrery
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  Orrery:
    type: application
    platform: iOS
    sources:
      - path: Orrery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.orrery.daily
        PRODUCT_NAME: Orrery
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Orrery-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Orrery
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
